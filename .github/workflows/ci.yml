name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # o build importa env.ts, que exige DATABASE_URL; este valor nunca é usado para conectar
      DATABASE_URL: postgresql://localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # os testes de extração chamam o pdftotext
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: pnpm test
      - run: pnpm build
